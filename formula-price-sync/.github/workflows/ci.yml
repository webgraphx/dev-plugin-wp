# ==============================================================================# Formula Price Sync – Continuous Integration# ==============================================================================# Automates:#   1. PHP syntax / smoke unit checks#   2. HPOS smoke-install harness#   3. Mandatory PHPUnit + PHPCS + MySQL CAS + WP/WC/HPOS + metadata/reproducibility gates#   4. Release ZIP build (artefact upload)## Secrets (optional, never required for fail-closed smoke):#   FPS_ZHAKET_PRODUCT_TOKEN – only if you add live-license jobs later## Trigger: push / pull_request on main branches + manual dispatch# ==============================================================================name: CIon:  push:    branches: [main, master, develop, 'release/**']  pull_request:    branches: [main, master, develop]  workflow_dispatch:    inputs:      skip_build:        description: 'Skip release ZIP build'        required: false        default: 'false'        type: booleanconcurrency:  group: ci-${{ github.workflow }}-${{ github.ref }}  cancel-in-progress: truejobs:  smoke:    name: Smoke (PHP ${{ matrix.php }})    runs-on: ubuntu-latest    strategy:      fail-fast: false      matrix:        php: ['7.4', '8.1', '8.2', '8.3']    steps:      - name: Checkout        uses: actions/checkout@v4      - name: Setup PHP        uses: shivammathur/setup-php@v2        with:          php-version: ${{ matrix.php }}          coverage: none          tools: composer:v2          ini-values: display_errors=On, error_reporting=E_ALL      - name: Ensure Composer platform stub        run: |          mkdir -p vendor/composer          if [ ! -f vendor/composer/platform_check.php ]; then            echo '<?php' > vendor/composer/platform_check.php          fi      - name: PHP syntax check (production)        run: |          set -e          find includes formula-price-sync.php uninstall.php -name '*.php' -print0 \            | xargs -0 -n1 php -l      - name: PHP syntax check (tests)        run: |          set -e          find tests -name '*.php' -print0 | xargs -0 -n1 php -l || true